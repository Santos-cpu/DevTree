name: Actualizador Diario de Tecnologías DevTree

on:
  schedule:
    # Se ejecuta automáticamente todos los días a las 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    # Permite ejecutarlo manualmente con un botón desde la pestaña Actions de GitHub

permissions:
  contents: write

jobs:
  update-catalog:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ejecutar rastreador y clasificador de tecnologías
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/update_catalog.py

      - name: Guardar cambios en el repositorio si hay novedades
        run: |
          git config user.name "DevTree Bot"
          git config user.email "actions@github.com"
          git add daily_tools.json
          if git diff --staged --quiet; then
            echo "Sin cambios en el catálogo hoy."
          else
            git commit -m "chore(atlas): actualización diaria automática de tecnologías"
            git push
          fi